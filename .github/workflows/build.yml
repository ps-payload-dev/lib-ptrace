name: Build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          repository: ps-payload-dev/sdk
          path: sdk

      - name: Set up both SDKs
        working-directory: sdk
        run: |
          sudo apt update
          sudo apt install clang-18 lld-18
          make DESTDIR=${{ runner.tool_cache }}/ps-payload-sdk clean install
          echo PS4_PAYLOAD_SDK=${{ runner.tool_cache }}/ps-payload-sdk/ps4 >> $GITHUB_ENV
          echo PS5_PAYLOAD_SDK=${{ runner.tool_cache }}/ps-payload-sdk/ps5 >> $GITHUB_ENV

      - name: Checkout lib-ptrace
        uses: actions/checkout@v4

      - name: Build PS4 and PS5
        run: |
          make PLATFORM=ps4 clean all &
          pid4=$!
          make PLATFORM=ps5 clean all &
          pid5=$!
          wait $pid4 && wait $pid5

      - name: Collect libraries
        run: |
          mkdir dist
          cp build/ps4/libptrace.a dist/libptrace-ps4.a
          cp build/ps5/libptrace.a dist/libptrace-ps5.a

      - name: Upload PS4 build
        uses: actions/upload-artifact@v4
        with:
          name: lib-ptrace-ps4
          path: |
            dist/libptrace-ps4.a
          if-no-files-found: error

      - name: Upload PS5 build
        uses: actions/upload-artifact@v4
        with:
          name: lib-ptrace-ps5
          path: |
            dist/libptrace-ps5.a
          if-no-files-found: error
